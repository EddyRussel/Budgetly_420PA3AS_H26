<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budgetly — Budgets</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/budgetly.css" rel="stylesheet"/>
  <style>
    /* Barre de progression budget */
    .budget-barre-fond {
      height: 8px;
      background: var(--gris-200);
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0 4px;
    }
    .budget-barre-rempli {
      height: 100%;
      border-radius: 99px;
      transition: width .4s ease;
    }
    .barre-ok     { background: var(--vert); }
    .barre-alerte { background: var(--orange); }
    .barre-depasse{ background: var(--rouge); }

    /* Carte budget */
    .budget-carte {
      background: var(--blanc);
      border-radius: var(--rayon-lg);
      padding: 1.25rem;
      box-shadow: var(--ombre);
      border: 1px solid var(--gris-200);
      transition: box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .budget-carte:hover { box-shadow: var(--ombre-md); }

    .budget-carte-accent {
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      border-radius: 99px 0 0 99px;
    }

    .budget-categorie {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--gris-400);
      margin-bottom: 4px;
    }

    .budget-nom {
      font-size: 15px;
      font-weight: 700;
      color: var(--gris-900);
      margin-bottom: 2px;
    }

    .budget-montants {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 6px;
    }
    .budget-depense {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--police-mono);
    }
    .budget-max {
      font-size: 13px;
      color: var(--gris-400);
      font-family: var(--police-mono);
    }

    .budget-restant {
      font-size: 12px;
      margin-top: 4px;
    }

    .badge-depasse {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--rouge-clair);
      color: var(--rouge);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      margin-top: 6px;
    }
    .badge-alerte {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--orange-clair);
      color: var(--orange);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      margin-top: 6px;
    }

    /* Résumé global */
    .resume-global {
      background: linear-gradient(135deg, #1A2332 0%, #2d3f57 100%);
      border-radius: var(--rayon-lg);
      padding: 1.25rem 1.5rem;
      color: white;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .resume-label { font-size: 12px; color: rgba(255,255,255,.6); margin-bottom: 2px; }
    .resume-valeur { font-size: 20px; font-weight: 700; font-family: var(--police-mono); }
    .resume-barre-fond {
      flex: 1; min-width: 150px;
      height: 10px;
      background: rgba(255,255,255,.2);
      border-radius: 99px;
      overflow: hidden;
    }
    .resume-barre-rempli {
      height: 100%;
      background: var(--vert-mid);
      border-radius: 99px;
      transition: width .5s ease;
    }

    /* État vide */
    .etat-vide {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--gris-400);
    }
    .etat-vide svg {
      width: 48px; height: 48px;
      margin-bottom: 1rem;
      opacity: .4;
    }
    .etat-vide p { font-size: 14px; margin-bottom: 1rem; }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar-slot"></aside>

  <div class="contenu-principal">

    <!-- Topbar -->
    <header class="topbar">
      <div>
        <div class="topbar-titre">Budgets</div>
        <div class="topbar-sous-titre" id="sous-titre-budgets">Chargement...</div>
      </div>
      <div class="topbar-droite">
        <button class="btn-vert" onclick="ouvrirModalAjout()">
          <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"/></svg>
          Nouveau budget
        </button>
      </div>
    </header>

    <div class="page-contenu">

      <!-- Résumé global -->
      <div class="resume-global" id="resume-global" style="display:none;">
        <div>
          <div class="resume-label">Dépensé ce mois</div>
          <div class="resume-valeur" id="resume-depense">—</div>
        </div>
        <div class="resume-barre-fond">
          <div class="resume-barre-rempli" id="resume-barre" style="width:0%"></div>
        </div>
        <div>
          <div class="resume-label">Budget total</div>
          <div class="resume-valeur" id="resume-total">—</div>
        </div>
        <div>
          <div class="resume-label">Restant</div>
          <div class="resume-valeur" id="resume-restant">—</div>
        </div>
      </div>

      <!-- Alertes -->
      <div id="zone-alertes" class="mb-3"></div>

      <!-- Grille des budgets -->
      <div class="row g-3" id="grille-budgets">
        <div class="col-12">
          <div class="kpi-carte">
            <div style="text-align:center; padding:2rem; color:var(--gris-400);">
              <div class="spinner-border spinner-border-sm text-secondary mb-2"></div>
              <div>Chargement des budgets...</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal : Ajouter / Modifier budget -->
<div class="modal fade" id="modalBudget" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modal-titre">Nouveau budget</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="row g-3">

          <!-- Catégorie -->
          <div class="col-12">
            <label class="champ-label">Catégorie (dépense)</label>
            <select id="bud-categorie" class="champ-select champ-input"></select>
          </div>

          <!-- Montant max -->
          <div class="col-6">
            <label class="champ-label">Montant maximum ($)</label>
            <input type="number" id="bud-montant" class="champ-input" placeholder="0.00" min="1" step="0.01"/>
          </div>

          <!-- Période -->
          <div class="col-6">
            <label class="champ-label">Période (mois)</label>
            <input type="month" id="bud-periode" class="champ-input"/>
          </div>

        </div>

        <!-- Erreur -->
        <div id="modal-erreur" class="alerte alerte-rouge mt-3" style="display:none;">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11v.5"/></svg>
          <div id="modal-erreur-texte"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-contour" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn-vert" onclick="sauvegarderBudget()">Enregistrer</button>
      </div>

    </div>
  </div>
</div>

<!-- Modal : Modifier montant max -->
<div class="modal fade" id="modalModifier" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Modifier le budget</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="champ-label">Nouveau montant maximum ($)</label>
        <input type="number" id="mod-montant" class="champ-input" min="1" step="0.01"/>
      </div>
      <div class="modal-footer">
        <button class="btn-contour" data-bs-dismiss="modal">Annuler</button>
        <button class="btn-vert" onclick="confirmerModification()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal : Supprimer -->
<div class="modal fade" id="modalSupprimer" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Supprimer ?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--gris-500);">
          Ce budget sera supprimé définitivement. Cette action est irréversible.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn-contour" data-bs-dismiss="modal">Annuler</button>
        <button class="btn-vert" style="background:var(--rouge);" onclick="confirmerSuppression()">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/sidebar.js"></script>
<script>
  injecterSidebar('budgets');

  const user = getUser();
  let tousBudgets    = [];
  let toutesCategories = [];
  let idASupprimer   = null;
  let idAModifier    = null;

  /* ── Formatage montant ─────────────────────────────── */
  function fmt(n) {
    return Math.abs(n).toLocaleString('fr-CA', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    }) + ' $';
  }

  /* ── Période courante (YYYY-MM) ────────────────────── */
  function periodeCourante() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  /* ── Charger tout ──────────────────────────────────── */
  async function charger() {
    try {
      const [repBud, repCat] = await Promise.all([
        fetch(`${API_URL}/budgets/user/${user.id}`),
        fetch(`${API_URL}/categories`)
      ]);

      tousBudgets      = await repBud.json();
      toutesCategories = await repCat.json();

      afficherResume();
      afficherAlertes();
      afficherBudgets();

    } catch (e) {
      console.error('Erreur chargement budgets:', e);
      document.getElementById('grille-budgets').innerHTML = `
        <div class="col-12">
          <div class="alerte alerte-rouge">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11v.5"/></svg>
            Impossible de charger les budgets. Vérifiez que Spring Boot est lancé.
          </div>
        </div>`;
    }
  }

  /* ── Résumé global ─────────────────────────────────── */
  function afficherResume() {
    if (!tousBudgets || tousBudgets.length === 0) return;

    const totalMax  = tousBudgets.reduce((s, b) => s + (b.maxAmount || 0), 0);
    const totalDep  = tousBudgets.reduce((s, b) => s + (b.currentAmount || 0), 0);
    const restant   = totalMax - totalDep;
    const pct       = totalMax > 0 ? Math.min((totalDep / totalMax) * 100, 100) : 0;

    document.getElementById('resume-depense').textContent  = fmt(totalDep);
    document.getElementById('resume-total').textContent    = fmt(totalMax);
    document.getElementById('resume-restant').textContent  = (restant >= 0 ? '' : '-') + fmt(Math.abs(restant));
    document.getElementById('resume-restant').style.color  = restant >= 0 ? '#8CB827' : '#E53E3E';
    document.getElementById('resume-barre').style.width    = pct + '%';
    document.getElementById('resume-global').style.display = 'flex';

    const nb = tousBudgets.length;
    document.getElementById('sous-titre-budgets').textContent =
      `${nb} budget${nb > 1 ? 's' : ''} ce mois`;
  }

  /* ── Alertes ───────────────────────────────────────── */
  function afficherAlertes() {
    const zone = document.getElementById('zone-alertes');
    const depasses = tousBudgets.filter(b => b.exceeded);
    const alertes  = tousBudgets.filter(b => !b.exceeded && b.nearLimit);

    let html = '';
    depasses.forEach(b => {
      html += `
        <div class="alerte alerte-rouge mb-2">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11v.5"/></svg>
          <div><strong>${b.category?.name || 'Budget'}</strong> — Dépassement de ${fmt(b.exceededAmount || 0)}</div>
        </div>`;
    });
    alertes.forEach(b => {
      html += `
        <div class="alerte alerte-orange mb-2">
          <svg viewBox="0 0 16 16"><path d="M8 2L2 13h12L8 2z"/><path d="M8 7v3M8 12v.5"/></svg>
          <div><strong>${b.category?.name || 'Budget'}</strong> — Budget presque atteint (${Math.round(b.usagePercent || 0)}%)</div>
        </div>`;
    });

    zone.innerHTML = html;
  }

  /* ── Afficher la grille ────────────────────────────── */
  function afficherBudgets() {
    const grille = document.getElementById('grille-budgets');

    if (!tousBudgets || tousBudgets.length === 0) {
      grille.innerHTML = `
        <div class="col-12">
          <div class="carte">
            <div class="etat-vide">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="8" y="14" width="32" height="24" rx="3"/>
                <path d="M16 14v-2a8 8 0 0116 0v2"/>
                <circle cx="24" cy="26" r="3"/>
              </svg>
              <p>Aucun budget défini pour ce mois</p>
              <button class="btn-vert" onclick="ouvrirModalAjout()">
                <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"/></svg>
                Créer un budget
              </button>
            </div>
          </div>
        </div>`;
      return;
    }

    grille.innerHTML = tousBudgets.map(b => {
      const pct       = b.usagePercent ? Math.min(b.usagePercent, 100) : 0;
      const depasse   = b.exceeded;
      const alerte    = !depasse && b.nearLimit;
      const couleur   = depasse ? 'var(--rouge)' : alerte ? 'var(--orange)' : 'var(--vert)';
      const classeBarre = depasse ? 'barre-depasse' : alerte ? 'barre-alerte' : 'barre-ok';
      const restant   = (b.maxAmount || 0) - (b.currentAmount || 0);

      let badgeHtml = '';
      if (depasse) {
        badgeHtml = `<div class="badge-depasse">
          <svg width="10" height="10" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11v.5"/></svg>
          Dépassement : ${fmt(b.exceededAmount || 0)}
        </div>`;
      } else if (alerte) {
        badgeHtml = `<div class="badge-alerte">
          <svg width="10" height="10" viewBox="0 0 16 16"><path d="M8 2L2 13h12L8 2z"/><path d="M8 7v3M8 12v.5"/></svg>
          Budget presque atteint !
        </div>`;
      }

      return `
        <div class="col-md-6 col-lg-4">
          <div class="budget-carte">
            <div class="budget-carte-accent" style="background:${couleur};"></div>
            <div style="padding-left: 10px;">
              <div class="budget-categorie">${b.period || periodeCourante()}</div>
              <div class="budget-nom">${b.category?.name || 'Sans catégorie'}</div>

              <div class="budget-montants">
                <span class="budget-depense" style="color:${couleur};">${fmt(b.currentAmount || 0)}</span>
                <span class="budget-max">/ ${fmt(b.maxAmount || 0)}</span>
              </div>

              <div class="budget-barre-fond">
                <div class="budget-barre-rempli ${classeBarre}" style="width:${pct}%;"></div>
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="budget-restant" style="color:${depasse ? 'var(--rouge)' : 'var(--gris-400)'};">
                  ${depasse ? 'Dépassé de ' + fmt(b.exceededAmount || 0) : 'Restant : ' + fmt(Math.max(restant, 0))}
                </span>
                <span style="font-size:11px; font-weight:700; color:${couleur};">${Math.round(pct)}%</span>
              </div>

              ${badgeHtml}

              <!-- Actions -->
              <div style="display:flex; gap:6px; margin-top:12px; padding-top:12px; border-top:1px solid var(--gris-200);">
                <button onclick="ouvrirModalModifier(${b.id}, ${b.maxAmount})"
                  style="flex:1; padding:6px; font-size:11px; font-weight:600; font-family:var(--police);
                         border:1px solid var(--gris-200); border-radius:7px; background:white; cursor:pointer;
                         color:var(--gris-700); transition:all .15s;"
                  onmouseover="this.style.borderColor='var(--vert)'"
                  onmouseout="this.style.borderColor='var(--gris-200)'">
                  ✏️ Modifier
                </button>
                <button onclick="reinitialiserBudget(${b.id})"
                  style="flex:1; padding:6px; font-size:11px; font-weight:600; font-family:var(--police);
                         border:1px solid var(--gris-200); border-radius:7px; background:white; cursor:pointer;
                         color:var(--gris-700); transition:all .15s;"
                  onmouseover="this.style.borderColor='var(--bleu)'"
                  onmouseout="this.style.borderColor='var(--gris-200)'">
                  🔄 Réinitialiser
                </button>
                <button onclick="supprimerBudget(${b.id})"
                  style="width:32px; padding:6px; font-size:11px;
                         border:1px solid var(--gris-200); border-radius:7px; background:white; cursor:pointer;
                         display:flex; align-items:center; justify-content:center; transition:all .15s;"
                  onmouseover="this.style.borderColor='var(--rouge)'"
                  onmouseout="this.style.borderColor='var(--gris-200)'">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="var(--rouge)" stroke-width="1.75" stroke-linecap="round">
                    <path d="M3 5h10M6 5V3h4v2M5 5l1 8h4l1-8"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  /* ── Modal ajout ───────────────────────────────────── */
  function ouvrirModalAjout() {
    document.getElementById('modal-titre').textContent = 'Nouveau budget';
    document.getElementById('bud-montant').value = '';
    document.getElementById('bud-periode').value = periodeCourante();
    document.getElementById('modal-erreur').style.display = 'none';

    // Peupler catégories DEPENSE
    const cats = toutesCategories.filter(c => c.type === 'DEPENSE');
    document.getElementById('bud-categorie').innerHTML =
      cats.length === 0
        ? '<option value="">Aucune catégorie de dépense</option>'
        : cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

    new bootstrap.Modal(document.getElementById('modalBudget')).show();
  }

  /* ── Sauvegarder budget ────────────────────────────── */
  async function sauvegarderBudget() {
    const categorieId = document.getElementById('bud-categorie').value;
    const montant     = parseFloat(document.getElementById('bud-montant').value);
    const periode     = document.getElementById('bud-periode').value;
    const erreurEl    = document.getElementById('modal-erreur');

    if (!categorieId || isNaN(montant) || montant <= 0 || !periode) {
      document.getElementById('modal-erreur-texte').textContent = 'Veuillez remplir tous les champs correctement.';
      erreurEl.style.display = 'flex';
      return;
    }

    erreurEl.style.display = 'none';

    try {
      const rep = await fetch(`${API_URL}/budgets`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId:     String(user.id),
          categoryId: String(categorieId),
          maxAmount:  String(montant),
          period:     periode
        })
      });

      if (!rep.ok) {
        const err = await rep.json();
        document.getElementById('modal-erreur-texte').textContent = err.message || 'Erreur serveur.';
        erreurEl.style.display = 'flex';
        return;
      }

      bootstrap.Modal.getInstance(document.getElementById('modalBudget')).hide();
      await charger();

    } catch (e) {
      document.getElementById('modal-erreur-texte').textContent = 'Impossible de contacter le serveur.';
      erreurEl.style.display = 'flex';
    }
  }

  /* ── Modifier montant ──────────────────────────────── */
  function ouvrirModalModifier(id, montantActuel) {
    idAModifier = id;
    document.getElementById('mod-montant').value = montantActuel;
    new bootstrap.Modal(document.getElementById('modalModifier')).show();
  }

  async function confirmerModification() {
    if (!idAModifier) return;
    const montant = parseFloat(document.getElementById('mod-montant').value);
    if (isNaN(montant) || montant <= 0) return;

    try {
      await fetch(`${API_URL}/budgets/${idAModifier}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ maxAmount: String(montant) })
      });
      bootstrap.Modal.getInstance(document.getElementById('modalModifier')).hide();
      idAModifier = null;
      await charger();
    } catch (e) {
      console.error('Erreur modification:', e);
    }
  }

  /* ── Réinitialiser ─────────────────────────────────── */
  async function reinitialiserBudget(id) {
    try {
      await fetch(`${API_URL}/budgets/${id}/reset`, { method: 'PUT' });
      await charger();
    } catch (e) {
      console.error('Erreur réinitialisation:', e);
    }
  }

  /* ── Supprimer ─────────────────────────────────────── */
  function supprimerBudget(id) {
    idASupprimer = id;
    new bootstrap.Modal(document.getElementById('modalSupprimer')).show();
  }

  async function confirmerSuppression() {
    if (!idASupprimer) return;
    try {
      await fetch(`${API_URL}/budgets/${idASupprimer}`, { method: 'DELETE' });
      bootstrap.Modal.getInstance(document.getElementById('modalSupprimer')).hide();
      idASupprimer = null;
      await charger();
    } catch (e) {
      console.error('Erreur suppression:', e);
    }
  }

  /* ── Lancement ─────────────────────────────────────── */
  charger();
</script>
</body>
</html>
