<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budgetly — Transactions</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/budgetly.css" rel="stylesheet"/>
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar-slot"></aside>

  <div class="contenu-principal">

    <!-- Topbar -->
    <header class="topbar">
      <div>
        <div class="topbar-titre">Transactions</div>
        <div class="topbar-sous-titre" id="compteur-tx">Chargement...</div>
      </div>
      <div class="topbar-droite">
        <button class="btn-vert" onclick="ouvrirModalAjout()">
          <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"/></svg>
          Nouvelle transaction
        </button>
      </div>
    </header>

    <div class="page-contenu">

      <!-- Résumé  -->
      <div class="row g-3 mb-4">
        <div class="col-4">
          <div class="kpi-carte animer" style="padding:.875rem 1rem;">
            <div class="kpi-label">Total revenus</div>
            <div class="kpi-valeur montant-pos" id="sum-revenus">—</div>
          </div>
        </div>
        <div class="col-4">
          <div class="kpi-carte animer" style="padding:.875rem 1rem;">
            <div class="kpi-label">Total dépenses</div>
            <div class="kpi-valeur montant-neg" id="sum-depenses">—</div>
          </div>
        </div>
        <div class="col-4">
          <div class="kpi-carte animer" style="padding:.875rem 1rem;">
            <div class="kpi-label">Solde net</div>
            <div class="kpi-valeur" id="sum-solde">—</div>
          </div>
        </div>
      </div>

      <!-- Filtres -->
      <div class="d-flex gap-2 flex-wrap mb-3">
        <!-- Recherche -->
        <div style="position:relative; flex:1; min-width:200px;">
          <svg style="position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--gris-400); fill:none; stroke-width:1.75;" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
          <input
            type="text"
            id="recherche"
            class="champ-input"
            style="padding-left:32px;"
            placeholder="Rechercher..."
            oninput="filtrerTransactions()"
          />
        </div>

        <!--  type -->
        <select id="filtre-type" class="champ-select" style="width:150px;" onchange="filtrerTransactions()">
          <option value="">Tout type</option>
          <option value="REVENU">Revenus</option>
          <option value="DEPENSE">Dépenses</option>
        </select>

        <!-- Filtre tri -->
        <select id="filtre-tri" class="champ-select" style="width:150px;" onchange="filtrerTransactions()">
          <option value="date-desc">Date ↓</option>
          <option value="date-asc">Date ↑</option>
          <option value="montant-desc">Montant ↓</option>
          <option value="montant-asc">Montant ↑</option>
        </select>
      </div>

      <!--Table -->
      <div class="carte animer">
        <div style="overflow-x:auto;">
          <table class="tableau" id="tableau-tx">
            <thead>
              <tr>
                <th>Description</th>
                <th>Type</th>
                <th>Catégorie</th>
                <th>Date</th>
                <th style="text-align:right;">Montant</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="corps-tableau">
              <tr>
                <td colspan="6" style="text-align:center; color:var(--gris-400); padding:2rem;">
                  Chargement...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Ajouter transaction -->
<div class="modal fade" id="modalTransaction" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modal-titre">Nouvelle transaction</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- Toggle Dépense / Revenu -->
        <div class="mb-3">
          <label class="champ-label">Type</label>
          <div style="display:flex; background:var(--gris-100); border-radius:var(--rayon); padding:3px; gap:3px;">
            <button type="button" id="btn-depense" onclick="setType('DEPENSE')"
              style="flex:1; padding:7px; border:none; border-radius:7px; font-size:13px; font-weight:600; font-family:var(--police); cursor:pointer; transition:all .15s; background:var(--rouge); color:#fff;">
              💸 Dépense
            </button>
            <button type="button" id="btn-revenu" onclick="setType('REVENU')"
              style="flex:1; padding:7px; border:none; border-radius:7px; font-size:13px; font-weight:600; font-family:var(--police); cursor:pointer; transition:all .15s; background:transparent; color:var(--gris-400);">
              💰 Revenu
            </button>
          </div>
          <input type="hidden" id="tx-type" value="DEPENSE"/>
        </div>

        <div class="row g-3">
          <!-- Description -->
          <div class="col-12">
            <label class="champ-label">Description</label>
            <input type="text" id="tx-description" class="champ-input" placeholder="Ex: Épicerie IGA…"/>
          </div>

          <!-- Montant -->
          <div class="col-6">
            <label class="champ-label">Montant ($)</label>
            <input type="number" id="tx-montant" class="champ-input" placeholder="0.00" min="0.01" step="0.01"/>
          </div>

          <!-- Date -->
          <div class="col-6">
            <label class="champ-label">Date</label>
            <input type="date" id="tx-date" class="champ-input"/>
          </div>

          <!-- Catégorie -->
          <div class="col-12">
            <label class="champ-label">Catégorie</label>
            <select id="tx-categorie" class="champ-select champ-input"></select>
          </div>
        </div>

        <!-- Erreur -->
        <div id="modal-erreur" class="alerte alerte-rouge mt-3" style="display:none;">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11v.5"/></svg>
          <div id="modal-erreur-texte"></div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn-contour" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn-vert" id="btn-sauvegarder" onclick="sauvegarderTransaction()">
          Enregistrer
        </button>
      </div>

    </div>
  </div>
</div>

<!-- supprimer -->
<div class="modal fade" id="modalSupprimer" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Supprimer ?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--gris-500);">
          Cette transaction sera supprimée définitivement. Cette action est irréversible.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn-contour" data-bs-dismiss="modal">Annuler</button>
        <button class="btn-vert" style="background:var(--rouge);" onclick="confirmerSuppression()">
          Supprimer
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/sidebar.js"></script>
<script>
  injecterSidebar('transactions');

  const user = getUser();
  let toutesTransactions = [];
  let toutesCategories   = [];
  let idEnEdition        = null;
  let idASupprimer       = null;
  let typeActuel         = 'DEPENSE';

  /* Formater montant */
  function fmt(montant) {
    return Math.abs(montant).toLocaleString('fr-CA', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    }) + ' $';
  }

  /* Charger données au démarrage */
  async function charger() {
    try {
      /* Transactions de l'utilisateur */
      const repTx  = await fetch(`${API_URL}/transactions/user/${user.id}`);
      toutesTransactions = await repTx.json();

      /* Catégories pour le select du modal */
      const repCat = await fetch(`${API_URL}/categories`);
      toutesCategories = await repCat.json();

      /* Solde */
      const repBal = await fetch(`${API_URL}/transactions/user/${user.id}/balance`);
      const balance = await repBal.json();

      afficherResume(balance);
      afficherTransactions(toutesTransactions);

    } catch (e) {
      console.error('Erreur:', e);
      document.getElementById('corps-tableau').innerHTML =
        `<tr><td colspan="6" style="text-align:center; color:var(--rouge); padding:2rem;">
          Impossible de charger les transactions. Vérifiez que Spring Boot est lancé.
        </td></tr>`;
    }
  }

  /*  Résumé */
  function afficherResume(balance) {
    document.getElementById('sum-revenus').textContent  = '+' + fmt(balance.totalIncome  || 0);
    document.getElementById('sum-depenses').textContent = '-' + fmt(balance.totalExpense || 0);

    const solde   = balance.balance || 0;
    const soldeEl = document.getElementById('sum-solde');
    soldeEl.textContent = (solde >= 0 ? '+' : '-') + fmt(Math.abs(solde));
    soldeEl.className   = 'kpi-valeur ' + (solde >= 0 ? 'montant-pos' : 'montant-neg');
  }

  /*  Afficher le tableau  */
  function afficherTransactions(transactions) {
    const tbody = document.getElementById('corps-tableau');
    document.getElementById('compteur-tx').textContent = transactions.length + ' transaction(s)';

    if (!transactions || transactions.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">
            <div class="etat-vide">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="8" width="32" height="32" rx="4"/><path d="M16 24h16M24 16v16"/></svg>
              <p>Aucune transaction trouvée</p>
            </div>
          </td>
        </tr>`;
      return;
    }

    tbody.innerHTML = transactions.map(tx => {
      const isPos = tx['@type'] === 'Revenu' || tx.type === 'REVENU';
      return `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <div style="
                width:30px; height:30px; border-radius:8px; font-size:14px;
                background:${isPos ? 'var(--vert-clair)' : 'var(--rouge-clair)'};
                display:flex; align-items:center; justify-content:center; flex-shrink:0;
              ">${isPos ? '💰' : '💸'}</div>
              <span style="font-weight:500; font-size:13px;">${tx.description || '—'}</span>
            </div>
          </td>
          <td>
            <span class="pill ${isPos ? 'pill-vert' : 'pill-rouge'}">
              ${isPos ? 'Revenu' : 'Dépense'}
            </span>
          </td>
          <td>
            <span class="pill pill-gris">${tx.category?.name || '—'}</span>
          </td>
          <td style="color:var(--gris-400); font-size:12px;">${tx.date || '—'}</td>
          <td style="text-align:right;" class="${isPos ? 'montant-pos' : 'montant-neg'}">
            ${isPos ? '+' : '-'}${fmt(tx.amount)}
          </td>
          <td>
            <div style="display:flex; gap:4px; justify-content:flex-end;">
              <button onclick="supprimerTx(${tx.id})" title="Supprimer"
                style="width:28px; height:28px; border-radius:6px; border:1px solid var(--gris-200);
                       background:white; cursor:pointer; display:flex; align-items:center; justify-content:center;
                       transition:all .15s;"
                onmouseover="this.style.borderColor='var(--rouge)'"
                onmouseout="this.style.borderColor='var(--gris-200)'">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="var(--rouge)" stroke-width="1.75" stroke-linecap="round">
                  <path d="M3 5h10M6 5V3h4v2M5 5l1 8h4l1-8"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  /*  Filtrer */
  function filtrerTransactions() {
    const recherche = document.getElementById('recherche').value.toLowerCase();
    const type      = document.getElementById('filtre-type').value;
    const tri       = document.getElementById('filtre-tri').value;

    let filtrees = toutesTransactions.filter(tx => {
      const desc    = (tx.description || '').toLowerCase();
      const catNom  = (tx.category?.name || '').toLowerCase();
      const matchRe = desc.includes(recherche) || catNom.includes(recherche);
      const txType  = tx['@type'] === 'Revenu' ? 'REVENU' : 'DEPENSE';
      const matchTy = !type || txType === type;
      return matchRe && matchTy;
    });

    filtrees.sort((a, b) => {
      if (tri === 'date-desc')    return new Date(b.date) - new Date(a.date);
      if (tri === 'date-asc')     return new Date(a.date) - new Date(b.date);
      if (tri === 'montant-desc') return b.amount - a.amount;
      if (tri === 'montant-asc')  return a.amount - b.amount;
      return 0;
    });

    afficherTransactions(filtrees);
  }

  /*  Modal : ouvrir ajout  */
  function ouvrirModalAjout() {
    idEnEdition = null;
    document.getElementById('modal-titre').textContent = 'Nouvelle transaction';
    document.getElementById('tx-description').value = '';
    document.getElementById('tx-montant').value     = '';
    document.getElementById('tx-date').value        = new Date().toISOString().split('T')[0];
    document.getElementById('modal-erreur').style.display = 'none';
    setType('DEPENSE');
    peuplerCategories('DEPENSE');
    new bootstrap.Modal(document.getElementById('modalTransaction')).show();
  }

  /*  Changer le type (Dépense / Revenu) */
  function setType(type) {
    typeActuel = type;
    document.getElementById('tx-type').value = type;

    const btnDep = document.getElementById('btn-depense');
    const btnRev = document.getElementById('btn-revenu');

    if (type === 'DEPENSE') {
      btnDep.style.background = 'var(--rouge)';
      btnDep.style.color      = '#fff';
      btnRev.style.background = 'transparent';
      btnRev.style.color      = 'var(--gris-400)';
    } else {
      btnRev.style.background = 'var(--vert)';
      btnRev.style.color      = '#fff';
      btnDep.style.background = 'transparent';
      btnDep.style.color      = 'var(--gris-400)';
    }

    peuplerCategories(type);
  }

  /*Peupler le select des catégories  */
  function peuplerCategories(type) {
    const select   = document.getElementById('tx-categorie');
    const filtrees = toutesCategories.filter(c => c.type === type);
    select.innerHTML = filtrees.map(c =>
      `<option value="${c.id}">${c.name}</option>`
    ).join('');
  }

  /*  Sauvegarder transaction */
  async function sauvegarderTransaction() {
    const description = document.getElementById('tx-description').value.trim();
    const montant     = parseFloat(document.getElementById('tx-montant').value);
    const date        = document.getElementById('tx-date').value;
    const categorieId = document.getElementById('tx-categorie').value;
    const type        = document.getElementById('tx-type').value;
    const erreurEl    = document.getElementById('modal-erreur');

    /* Validation */
    if (!description || isNaN(montant) || montant <= 0 || !date || !categorieId) {
      document.getElementById('modal-erreur-texte').textContent = 'Veuillez remplir tous les champs correctement.';
      erreurEl.style.display = 'flex';
      return;
    }

    erreurEl.style.display = 'none';





    try {
      /*  Appel API : POST /api/transactions ──
         Envoie la nouvelle transaction au backend
         Le backend la sauvegarde en MySQL et met à jour le budget
         */
      const reponse = await fetch(`${API_URL}/transactions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId:      String(user.id),
          categoryId:  String(categorieId),
          type:        type,
          amount:      String(montant),
          date:        date,
          description: description
        })
      });

      if (!reponse.ok) {
        const err = await reponse.json();
        document.getElementById('modal-erreur-texte').textContent = err.message || 'Erreur serveur.';
        erreurEl.style.display = 'flex';
        return;
      }

      /* Ferme le modal et recharge */
      bootstrap.Modal.getInstance(document.getElementById('modalTransaction')).hide();
      await charger();

    } catch (e) {
      document.getElementById('modal-erreur-texte').textContent = 'Impossible de contacter le serveur.';
      erreurEl.style.display = 'flex';
    }
  }

  /*  Supprimer  */
  function supprimerTx(id) {
    idASupprimer = id;
    new bootstrap.Modal(document.getElementById('modalSupprimer')).show();
  }

  async function confirmerSuppression() {
    if (!idASupprimer) return;





    
    try {
      /*  Appel API : DELETE /api/transactions/{id}
         Supprime la transaction et met à jour le budget
          */
      await fetch(`${API_URL}/transactions/${idASupprimer}`, { method: 'DELETE' });

      bootstrap.Modal.getInstance(document.getElementById('modalSupprimer')).hide();
      idASupprimer = null;
      await charger();

    } catch (e) {
      console.error('Erreur suppression:', e);
    }
  }

  /* Lance le chargement */
  charger();
</script>
</body>
</html>
