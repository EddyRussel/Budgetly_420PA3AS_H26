# Connexion à MySQL

# L'adresse de la base de données
# localhost = sur notre propre ordinateur

spring.application.name=Budgetly_v1_avecSB
spring.datasource.url = jdbc:mysql://localhost:3306/budgetly
spring.datasource.username=root
spring.datasource.password=root

# Le driver JDBC : c'est la classe Java qui sait parler à MySQL
# Spring Boot l'utilise pour établir la connexion physique

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver





# JPA / Hibernate

# Comportement de Hibernate au démarrage :
# "update" = met à jour les tables existantes si les classes changent
#            SANS effacer les données existantes

spring.jpa.hibernate.ddl-auto=update

# Affiche le SQL généré par Hibernate dans la console
spring.jpa.show-sql=true

# Formate le SQL affiché pour qu'il soit lisible
spring.jpa.properties.hibernate.format_sql=true

# Le dialecte : dit à Hibernate qu'on utilise MySQL
# Hibernate adapte le SQL généré selon la base de données
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Le port sur lequel Spring Boot écoute les requêtes
# C'est pourquoi on tape http://localhost:8080
server.port=8080
